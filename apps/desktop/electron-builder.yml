appId: com.studyalarm.app
productName: Study Alarm
copyright: Copyright © Study Alarm
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: native
    to: native
    filter:
      - "**/*"
  - from: assets
    to: assets
    filter:
      - "trayTemplate*.png"
      - "icon.png"
extraMetadata:
  main: dist/main.js
asar: true

# Friendly names applied in scripts/rename-release-artifacts.cjs
afterAllArtifactBuild: ./scripts/rename-release-artifacts.cjs

mac:
  icon: assets/icon.icns
  category: public.app-category.education
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: Study Alarm
  # intermediate → rename-release-artifacts: Mac.dmg / Mac-Intel.dmg
  artifactName: build-mac-${arch}.${ext}

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # intermediate → Windows.exe
  artifactName: build-win.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Study Alarm

linux:
  icon: assets/icon.png
  category: Education
  target:
    - AppImage
  artifactName: Linux.${ext}
