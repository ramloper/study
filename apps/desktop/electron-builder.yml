appId: com.studyalarm.app
productName: Study Alarm
copyright: Copyright © Study Alarm
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: native
    to: native
    filter:
      - "**/*"
  - from: assets
    to: assets
    filter:
      - "trayTemplate*.png"
      - "icon.png"
extraMetadata:
  main: dist/main.js
asar: true

# afterPack: ad-hoc codesign (fixes macOS "damaged" on download)
afterPack: ./scripts/after-pack.cjs
# Friendly names applied in scripts/rename-release-artifacts.cjs
afterAllArtifactBuild: ./scripts/rename-release-artifacts.cjs

mac:
  icon: assets/icon.icns
  category: public.app-category.education
  # null = skip signing → broken partial Electron linker signatures → "damaged"
  # "-" = ad-hoc sign (no Apple Developer account). afterPack also deep-signs.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  # CI: dist:mac:ci passes --arm64 --x64 (host arch alone skips Intel)
  artifactName: build-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  # Avoid space + shared mount name when building multiple arch DMGs
  title: StudyAlarm

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # intermediate → Windows.exe
  artifactName: build-win.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Study Alarm

linux:
  icon: assets/icon.png
  category: Education
  target:
    - AppImage
  artifactName: Linux.${ext}
